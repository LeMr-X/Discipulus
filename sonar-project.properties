# Configuração do SonarCloud (https://sonarcloud.io)
# Confira projectKey e organization na página do projeto no SonarCloud
# (Information -> Project Key / Organization Key) e ajuste se forem diferentes.
sonar.projectKey=LeMr-X_Discipulus
sonar.organization=lemr-x
sonar.projectName=Discipulus

sonar.sourceEncoding=UTF-8
sonar.sources=backend/src,frontend/src,database
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Cobertura: só o back-end tem testes automatizados nesta etapa.
# O front-end entra no cálculo quando tiver testes (ver docs/PLANO_DE_TESTES.md).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.coverage.exclusions=frontend/**,database/**,backend/src/server.ts,backend/src/tipos.ts
