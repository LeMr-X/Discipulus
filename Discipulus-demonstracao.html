<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discipulus — Demonstração</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5a46'/%3E%3Cpath d='M7 10.2c3-.9 6-.6 8.2 1v11.6c-2.2-1.4-5.2-1.7-8.2-.9V10.2Z' fill='%23fff'/%3E%3Cpath d='M25 10.2c-3-.9-6-.6-8.2 1v11.6c2.2-1.4 5.2-1.7 8.2-.9V10.2Z' fill='%23fff' fill-opacity='.72'/%3E%3C/svg%3E">
<!--
  Discipulus — versão de demonstração (arquivo único, abre direto no navegador).

  Serve para mostrar o sistema sem instalar nada (sem Node, sem MySQL).
  Reproduz as regras do sistema real:
    - login por RA (aluno) ou e-mail (funcionário);
    - 3 senhas erradas seguidas bloqueiam por 15 minutos (sp_registrar_login);
    - usuário inativo é recusado; login inexistente dá a mesma mensagem da senha errada;
    - permissões por cargo (backend/src/permissoes.ts);
    - média e situação iguais à view vw_boletim.
  Diferenças: os dados ficam só neste navegador (localStorage) e a senha é
  conferida em texto aqui; no sistema real ela é guardada com BCrypt no MySQL.
-->
<style>
:root{
  color-scheme:light;
  --bg:#f5f3ee;--surface:#fff;--surface-2:#efece5;
  --border:rgb(28 34 30/.09);--border-strong:rgb(28 34 30/.16);
  --fg:#1b211d;--muted:#59625b;--subtle:#8b938c;
  --brand:#1f5a46;--brand-hover:#174837;--brand-fg:#fff;--brand-soft:rgb(31 90 70/.1);--ring:rgb(31 90 70/.25);
  --accent:#b5832a;
  --success:#237a4b;--success-soft:rgb(35 122 75/.11);
  --warning:#a8691b;--warning-soft:rgb(168 105 27/.13);
  --danger:#b83a2e;--danger-soft:rgb(184 58 46/.09);
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#121513;--surface:#191d1a;--surface-2:#20251f;
  --border:rgb(255 255 255/.07);--border-strong:rgb(255 255 255/.13);
  --fg:#ebeee9;--muted:#a3aba4;--subtle:#727a73;
  --brand:#6fbf9b;--brand-hover:#86cdab;--brand-fg:#0f1411;--brand-soft:rgb(111 191 155/.13);--ring:rgb(111 191 155/.35);
  --accent:#d9a54a;
  --success:#5fc48a;--success-soft:rgb(95 196 138/.13);
  --warning:#e0a94a;--warning-soft:rgb(224 169 74/.13);
  --danger:#ef7d70;--danger-soft:rgb(239 125 112/.12);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.15}
h2{font-size:15px;font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.subtle{color:var(--subtle)}
.small{font-size:13px}
.serif{font-family:var(--serif)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Faixa de demonstração */
.demo-bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;padding:7px 16px;background:var(--accent);color:#fff;font-size:13px;text-align:center}
.demo-bar button{background:rgb(255 255 255/.18);border:0;border-radius:6px;padding:2px 10px;color:#fff;font-size:13px}
.demo-bar button:hover{background:rgb(255 255 255/.28)}

/* Botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-weight:500;font-size:14px;transition:background-color .15s,transform .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:var(--brand-fg)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn-lg{height:48px;font-size:15px;width:100%}
.btn-sm{height:32px;padding:0 12px}
.btn[disabled]{opacity:.6;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500}
.input{height:44px;width:100%;padding:0 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
.input[aria-invalid=true]{border-color:var(--danger)}
.err{font-size:13px;color:var(--danger)}
.pw{position:relative}.pw .input{padding-right:70px}
.pw button{position:absolute;right:6px;top:6px;height:32px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:13px}
.pw button:hover{background:var(--surface-2);color:var(--fg)}

/* Alerta de erro do login */
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:8px;border:1px solid color-mix(in srgb,var(--danger) 25%,transparent);background:var(--danger-soft);font-size:14px}
.alert b{color:var(--danger);font-weight:600;display:block}
.shake{animation:shake .36s cubic-bezier(.23,1,.32,1)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}
.rise{animation:rise .4s cubic-bezier(.23,1,.32,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.shake,.rise{animation:none}}

/* Tela de login */
.login{display:grid;min-height:calc(100dvh - 34px)}
@media (min-width:1024px){.login{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.login main{display:flex;flex-direction:column;padding:32px 24px}
@media (min-width:640px){.login main{padding:32px 40px}}
.login .form-wrap{margin:0 auto;width:100%;max-width:380px;flex:1;display:flex;flex-direction:column;justify-content:center;padding:48px 0}
.login form{display:flex;flex-direction:column;gap:20px;margin-top:32px}
.contas{margin-top:36px;padding:14px;border:1px dashed var(--border-strong);border-radius:8px}
.contas p{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}
.contas div{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.contas button{border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:13px;transition:background-color .15s}
.contas button:hover{background:var(--surface-2)}
.vitrine{display:none;background:#173f32;color:#f1ede3}
.vitrine-in{position:sticky;top:0;height:calc(100dvh - 34px);max-height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:32px 40px}
.vitrine .rabiscos-caixa{flex:1;min-height:0;display:flex;align-items:center;padding:24px 0}
.vitrine .rabiscos{width:100%;max-width:520px;max-height:100%}
.vitrine figure{margin:0;max-width:520px;border-top:1px solid rgb(241 237 227/.15);padding-top:24px}
.vitrine blockquote{margin:0;font-family:var(--serif);font-style:italic;font-size:30px;line-height:1.3;opacity:.9}
.vitrine figcaption{margin-top:12px;font-size:14px;opacity:.55}
@media (min-width:1024px){.vitrine{display:block}}
.vitrine .palavra{font-family:var(--serif);font-size:72px;font-weight:600;line-height:1;letter-spacing:-.02em}
.vitrine .pron{margin-top:16px;font-family:var(--serif);font-style:italic;font-size:17px;opacity:.75}
.vitrine .def{margin-top:20px;max-width:44ch;border-left:2px solid #d9a54a;padding-left:16px;font-size:16px;line-height:1.6;opacity:.9}

/* Estrutura das telas internas */
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:1152px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px}
@media (min-width:640px){.top-in{padding:0 24px}}
.top-left{display:flex;align-items:center;gap:28px;min-width:0}
.logo{display:flex;align-items:center;gap:10px}
.logo span{font-family:var(--serif);font-size:19px;font-weight:600}
nav.menu{display:flex;gap:4px;overflow-x:auto}
nav.menu a{display:flex;align-items:center;height:36px;padding:0 12px;border-radius:6px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;white-space:nowrap}
nav.menu a:hover{background:var(--surface-2);color:var(--fg)}
nav.menu a.ativo{background:var(--brand-soft);color:var(--brand)}
nav.menu-cel{display:flex;padding:0 12px 8px}
nav.menu-pc{display:none}
@media (min-width:768px){nav.menu-cel{display:none}nav.menu-pc{display:flex}}
.quem{display:flex;align-items:center;gap:10px;min-width:0}
.quem .nome{display:none;text-align:right;min-width:0}
@media (min-width:640px){.quem .nome{display:block}}
.avatar{display:grid;place-items:center;width:36px;height:36px;flex-shrink:0;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:600}
.pagina{max-width:1152px;margin:0 auto;padding:32px 16px}
@media (min-width:640px){.pagina{padding:40px 24px}}
.cab{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.cab h1{font-size:30px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px rgb(28 34 30/.05);min-width:0}
.card-h{padding:20px 24px 0}
.card-h p{font-size:14px;color:var(--muted);margin-top:2px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid3{gap:16px}}
.ind{padding:16px 20px}
.ind .v{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1;margin-top:10px}
.lado{display:grid;gap:24px;align-items:start;margin-top:24px}
@media (min-width:1024px){.lado{grid-template-columns:minmax(0,1fr) 320px}}
.tabela{width:100%;border-collapse:collapse;font-size:14px}
.tabela th{background:var(--surface-2);text-align:left;font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--subtle);padding:10px 12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.tabela td{padding:13px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tabela tr:last-child td{border-bottom:0}
.tabela th:first-child,.tabela td:first-child{padding-left:24px}
.tabela th:last-child,.tabela td:last-child{padding-right:24px}
.r{text-align:right}
.scroll{overflow-x:auto;margin-top:16px}
.baixa{color:var(--danger)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-success{background:var(--success-soft);color:var(--success)}
.b-warning{background:var(--warning-soft);color:var(--warning)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
.b-brand{background:var(--brand-soft);color:var(--brand)}
.b-neutral{background:var(--surface-2);color:var(--muted)}
dl.dados{display:flex;flex-direction:column;gap:14px;padding:16px 24px 20px;margin:0;font-size:14px}
dl.dados dt{font-size:12px;color:var(--muted)}
dl.dados dd{margin:0;overflow-wrap:anywhere}
ol.hist{list-style:none;margin:0;padding:16px 24px 20px}
ol.hist li{position:relative;padding:0 0 16px 26px}
ol.hist li:last-child{padding-bottom:0}
ol.hist li::before{content:"";position:absolute;left:3px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--brand)}
ol.hist li:not(:last-child)::after{content:"";position:absolute;left:7px;top:18px;bottom:0;width:1px;background:var(--border-strong)}
.lista a{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
.lista a:last-child{border-bottom:0}
.lista a:hover{background:var(--surface-2)}
.lista .info{min-width:0;flex:1}
.lista .info p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.esconde-cel{display:none}
@media (min-width:640px){.esconde-cel{display:block}}
.busca{padding:14px;border-bottom:1px solid var(--border)}
.busca input{height:40px;border:0;background:var(--surface-2)}
.vazio{padding:48px 24px;text-align:center;color:var(--muted);font-size:14px}
.voltar{display:inline-block;margin-bottom:12px;font-size:14px;color:var(--muted);text-decoration:none}
.voltar:hover{color:var(--fg)}
.form-grid{display:grid;gap:16px;padding:20px 24px 24px}
@media (min-width:640px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .full{grid-column:1/-1}}
.nota-in{width:72px;height:36px;text-align:right;padding:0 10px;font-variant-numeric:tabular-nums}
.cursos{display:grid;gap:16px}
@media (min-width:900px){.cursos{grid-template-columns:1fr 1fr}}
.linha{display:flex;justify-content:space-between;gap:12px;padding:10px 24px;border-top:1px solid var(--border);font-size:14px}
.acoes{display:flex;flex-wrap:wrap;gap:8px}

/* Avisos rápidos */
#toast{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgb(0 0 0/.18);animation:rise .3s cubic-bezier(.23,1,.32,1) both}
</style>
</head>
<body>
<div class="demo-bar">
  <span><b>Modo demonstração</b> · roda direto no navegador, sem instalar nada. Os dados ficam só neste computador.</span>
  <button type="button" id="resetar">Restaurar dados de exemplo</button>
</div>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict'

/* =====================================================================
   Dados de exemplo (mesmos de database/03_dados.sql)
   ===================================================================== */
const SENHA_PADRAO = 'Senha@123'
const MAX_FALHAS = 3
const MINUTOS_BLOQUEIO = 15

function dadosIniciais() {
  return {

      { id: 1, ra: '2026000001', nome: 'Ana Souza', cpf: '12345678901', email: 'ana.souza@aluno.edu.br', telefone: '48999990001', cidade: 'Florianópolis', uf: 'SC' },
      { id: 2, ra: '2026000002', nome: 'Bruno Costa', cpf: '23456789012', email: 'bruno.costa@aluno.edu.br', telefone: '48999990002', cidade: 'Florianópolis', uf: 'SC' },
      { id: 3, ra: '2026000003', nome: 'Camila Ferreira', cpf: '34567890123', email: 'camila.ferreira@aluno.edu.br', telefone: '48999990003', cidade: 'Palhoça', uf: 'SC' },
      { id: 4, ra: '2026000004', nome: 'Diego Martins', cpf: '45678901234', email: 'diego.martins@aluno.edu.br', telefone: '48999990004', cidade: 'Palhoça', uf: 'SC' },
      { id: 5, ra: '2026000005', nome: 'Eduarda Rocha', cpf: '56789012345', email: 'eduarda.rocha@aluno.edu.br', telefone: '48999990005', cidade: 'São José', uf: 'SC' },
      { id: 6, ra: '2026000006', nome: 'Felipe Almeida', cpf: '67890123456', email: 'felipe.almeida@aluno.edu.br', telefone: null, cidade: 'Tubarão', uf: 'SC' },
    ],
    matriculas: [
      { idAluno: 1, idCurso: 1, data: '2026-02-10', status: 'ATIVA' },
      { idAluno: 2, idCurso: 1, data: '2026-02-10', status: 'ATIVA' },
      { idAluno: 3, idCurso: 2, data: '2026-02-12', status: 'ATIVA' },

    notas: {

    },

        login: n + '@faculdade.edu.br', senha: SENHA_PADRAO, perfil: 'FUNCIONARIO', idFuncionario: i + 1, ativo: true,
      })),
      ...[1, 2, 3, 4, 5, 6].map((id) => ({
        login: '202600000' + id, senha: SENHA_PADRAO, perfil: 'ALUNO', idAluno: id, ativo: id !== 6,

}

/* =====================================================================
   Armazenamento (localStorage pode falhar em janela anônima: aí fica só na memória)
   ===================================================================== */
const CHAVE = 'discipulus-demo-v1'
let db
try { db = JSON.parse(localStorage.getItem(CHAVE)) } catch { db = null }
if (!db || !db.usuarios) db = dadosIniciais()
function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(db)) } catch { /* sem armazenamento */ } }

let sessao = null
try { sessao = JSON.parse(sessionStorage.getItem(CHAVE + '-sessao')) } catch { sessao = null }
function guardarSessao() {
  try {
    if (sessao) sessionStorage.setItem(CHAVE + '-sessao', JSON.stringify(sessao))
    else sessionStorage.removeItem(CHAVE + '-sessao')
  } catch { /* sem armazenamento */ }
}

/* =====================================================================
   Regras (iguais ao back-end)
   ===================================================================== */
const PERMISSOES = {
  consultar: ['SECRETARIA', 'PROFESSOR', 'COORDENADOR', 'ADMINISTRADOR'],
  cadastros: ['SECRETARIA', 'COORDENADOR', 'ADMINISTRADOR'],
  notas: ['PROFESSOR', 'COORDENADOR', 'ADMINISTRADOR'],
  auditoria: ['ADMINISTRADOR', 'COORDENADOR'],
}

/** sp_registrar_login + authService.login */
function fazerLogin(loginInformado, senha) {
  const login = loginInformado.trim()
  const u = db.usuarios.find((x) => x.login === login)
  const agora = Date.now()
  let motivo
  if (!u) motivo = 'USUARIO_INEXISTENTE'
  else if (!u.ativo) motivo = 'USUARIO_INATIVO'
  else if (u.bloqueadoAte && u.bloqueadoAte > agora) motivo = 'USUARIO_BLOQUEADO'
  else if (u.senha === senha) {
    motivo = 'OK'
    u.falhas = 0; u.bloqueadoAte = null; u.ultimoAcesso = agora
  } else {
    motivo = 'SENHA_INVALIDA'
    const falhas = u.falhas + 1
    u.falhas = falhas >= MAX_FALHAS ? 0 : falhas
    u.bloqueadoAte = falhas >= MAX_FALHAS ? agora + MINUTOS_BLOQUEIO * 60000 : null
  }
  db.logAcesso.unshift({ data: agora, login, sucesso: motivo === 'OK', motivo })
  db.logAcesso = db.logAcesso.slice(0, 200)
  salvar()

  if (motivo === 'OK') return { ok: true, usuario: montarUsuario(u) }
  if (motivo === 'SENHA_INVALIDA' && u.bloqueadoAte) return { ok: false, motivo: 'USUARIO_BLOQUEADO', bloqueadoAte: u.bloqueadoAte }
  if (motivo === 'SENHA_INVALIDA') return { ok: false, motivo, tentativasRestantes: MAX_FALHAS - u.falhas }
  if (motivo === 'USUARIO_BLOQUEADO') return { ok: false, motivo, bloqueadoAte: u.bloqueadoAte }
  return { ok: false, motivo }
}

function montarUsuario(u) {
  if (u.perfil === 'ALUNO') {
    const a = db.alunos.find((x) => x.id === u.idAluno)
    return { login: u.login, perfil: 'ALUNO', nome: a.nome, ra: a.ra, cargo: null, idAluno: a.id }
  }
  const f = db.funcionarios.find((x) => x.id === u.idFuncionario)
  return { login: u.login, perfil: 'FUNCIONARIO', nome: f.nome, ra: null, cargo: f.cargo, idAluno: null }
}

function mensagemErro(r) {
  switch (r.motivo) {
    case 'USUARIO_INEXISTENTE':
      return { titulo: 'RA/e-mail ou senha incorretos', detalhe: 'Confira os dados e tente de novo.' }
    case 'SENHA_INVALIDA':
      return { titulo: 'RA/e-mail ou senha incorretos', detalhe: `${pluralizar(r.tentativasRestantes, 'tentativa restante', 'tentativas restantes')} antes do bloqueio temporário.` }
    case 'USUARIO_BLOQUEADO':
      return { titulo: 'Acesso bloqueado temporariamente', detalhe: `Por segurança, após 3 tentativas erradas o acesso fica bloqueado. Tente de novo às ${formatHora(r.bloqueadoAte)}.` }
    case 'USUARIO_INATIVO':
      return { titulo: 'Seu acesso está desativado', detalhe: 'Procure a secretaria acadêmica para reativar.' }
  }
}

/** Mesma regra da view vw_boletim */
function situacao(n) {
  const lancadas = [n.A1, n.A2, n.A3].filter((x) => x !== null && x !== undefined)
  if (!lancadas.length) return { media: null, situacao: null }
  const media = Math.round((lancadas.reduce((s, x) => s + x, 0) / lancadas.length) * 100) / 100
  return { media, situacao: lancadas.length < 3 ? 'EM ANDAMENTO' : media >= 7 ? 'APROVADO' : 'REPROVADO' }
}

function boletimDo(idAluno) {
  return db.disciplinas
    .map((d) => ({ d, n: db.notas[idAluno + '-' + d.id] }))
    .filter((x) => x.n && situacao(x.n).media !== null)
    .map(({ d, n }) => ({ disciplina: d.nome, semestre: d.semestre, a1: n.A1, a2: n.A2, a3: n.A3, ...situacao(n) }))
    .sort((a, b) => a.semestre - b.semestre)
}

const matriculaDo = (idAluno) => db.matriculas.filter((m) => m.idAluno === idAluno).at(-1) || null
const cursoPorId = (id) => db.cursos.find((c) => c.id === id)

const fmtNota = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 2 })
const nota = (n) => (n === null || n === undefined ? '—' : fmtNota.format(n))
const formatHora = (t) => new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' }).format(new Date(t))
const formatDataHora = (t) => new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date(t))
function formatData(iso) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }).formatToParts(new Date(iso + 'T12:00:00')).map((x) => [x.type, x.value]))
  return `${p.day} ${p.month.replace('.', '')} ${p.year}`
}
const plural = new Intl.PluralRules('pt-BR')
const pluralizar = (n, um, varios) => `${n} ${plural.select(n) === 'one' ? um : varios}`
const primeiroNome = (nome) => nome.trim().split(/\s+/)[0]
function iniciais(nome) {
  const p = nome.trim().split(/\s+/)
  return ((p[0]?.[0] || '') + (p.length > 1 ? p.at(-1)[0] : '')).toUpperCase()
}
const formatCpf = (v) => v.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4')
const formatTel = (v) => v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3')
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

function inicio() {
  if (!sessao) return '#/login'
  if (sessao.perfil === 'ALUNO') return '#/aluno'
  return pode('cadastros') ? '#/alunos' : '#/notas'
}

function rota() {
  const [, pagina, param] = (location.hash || '#/').split('/')
  if (!sessao && pagina !== 'login') return ir('#/login')
  if (sessao && (pagina === 'login' || !pagina)) return ir(inicio())
  window.scrollTo(0, 0)
  if (pagina === 'login') return telaLogin()
  if (pagina === 'aluno' && sessao.perfil === 'ALUNO') return telaAluno()
  if (sessao.perfil === 'FUNCIONARIO') {
    if (pagina === 'alunos' && param && pode('consultar')) return telaAlunoDetalhe(Number(param))
    if (pagina === 'alunos' && pode('consultar')) return telaAlunos()
    if (pagina === 'novo-aluno' && pode('cadastros')) return telaNovoAluno()
    if (pagina === 'cursos' && pode('consultar')) return telaCursos()
    if (pagina === 'notas' && pode('notas')) return telaNotas(Number(param) || null)
    if (pagina === 'acessos' && pode('auditoria')) return telaAcessos()
  }
  ir(inicio())
}
function ir(hash) { if (location.hash === hash) rota(); else location.hash = hash }
window.addEventListener('hashchange', rota)

      <div class="card ind"><p class="small muted">Aprovações</p><p class="v tab">${aprovadas}</p><p class="small muted" style="margin-top:6px">de ${pluralizar(fechadas.length, 'disciplina concluída', 'disciplinas concluídas')}</p></div>
      <div class="card ind"><p class="small muted">Cursando</p><p class="v tab">${bol.length - fechadas.length}</p><p class="small muted" style="margin-top:6px">${bol.length - fechadas.length ? 'aguardando notas' : 'nenhuma pendente'}</p></div>
    </section>
    <div class="lado">
      <div class="card rise" style="animation-delay:140ms">
        <div class="card-h"><h2>Boletim</h2><p>Média aprovada a partir de 7,0 com as três avaliações.</p></div>
        ${tabelaBoletim(bol)}
      </div>
      <div style="display:flex;flex-direction:column;gap:24px;min-width:0">
        <div class="card rise" style="animation-delay:180ms">
          <div class="card-h"><h2>Meus dados</h2></div>
          <dl class="dados">
            <div><dt>RA</dt><dd class="tab">${esc(aluno.ra)}</dd></div>
            <div><dt>E-mail</dt><dd>${esc(aluno.email)}</dd></div>
            ${aluno.telefone ? `<div><dt>Telefone</dt><dd class="tab">${esc(formatTel(aluno.telefone))}</dd></div>` : ''}
            ${aluno.cidade ? `<div><dt>Cidade</dt><dd>${esc(aluno.cidade)}${aluno.uf ? ' – ' + esc(aluno.uf) : ''}</dd></div>` : ''}
          </dl>
        </div>
        <div class="card rise" style="animation-delay:220ms">
          <div class="card-h"><h2>Histórico acadêmico</h2></div>
          <ol class="hist">${hist.map((h) => `<li><p style="font-size:14px;font-weight:500">${esc(h.obs)}</p><p class="small muted">${esc(cursoPorId(h.idCurso).nome)}</p><p class="small subtle tab">${formatData(h.data)}</p></li>`).join('') || '<li class="muted small">Sem registros.</li>'}</ol>
        </div>
      </div>
    </div>`)
}

/* =====================================================================
   Funcionário: alunos
   ===================================================================== */
function telaAlunos() {
  document.title = 'Alunos · Discipulus'
  casca('alunos', `
    ${cabecalho('Alunos', `<span id="qtd"></span>`, pode('cadastros') ? '<a class="btn btn-primary" href="#/novo-aluno" style="text-decoration:none">+ Novo aluno</a>' : '')}
    <div class="card rise" style="animation-delay:60ms">
      <div class="busca"><input class="input" id="busca" placeholder="Buscar por nome, RA, CPF ou e-mail" aria-label="Buscar alunos"></div>
      <div class="lista" id="lista"></div>
    </div>`)
  const $lista = document.getElementById('lista')
  const desenhar = () => {
    const q = document.getElementById('busca').value.trim().toLowerCase()
    const qd = q.replace(/\D/g, '')
    const achados = db.alunos.filter((a) => !q || a.nome.toLowerCase().includes(q) || a.email.toLowerCase().includes(q) || (qd && (a.ra.includes(qd) || a.cpf.includes(qd))))
    document.getElementById('qtd').textContent = pluralizar(achados.length, 'aluno encontrado', 'alunos encontrados')
    $lista.innerHTML = achados.length ? achados.map((a) => {
      const m = matriculaDo(a.id)
      return `<a href="#/alunos/${a.id}">
        <span class="avatar">${esc(iniciais(a.nome))}</span>
        <div class="info"><p style="font-size:14px;font-weight:500">${esc(a.nome)}</p><p class="small muted">${esc(a.email)}</p></div>
        <div class="info esconde-cel"><p class="small tab">RA ${esc(a.ra)}</p><p class="small muted">${m ? esc(cursoPorId(m.idCurso).nome) : 'Sem matrícula'}</p></div>
        ${m ? badge(MATRICULA[m.status]) : ''}
        <span class="subtle" aria-hidden="true">›</span>
      </a>`
    }).join('') : `<p class="vazio">Nenhum aluno encontrado.</p>`
  }
  document.getElementById('busca').addEventListener('input', desenhar)
  desenhar()
}

function telaAlunoDetalhe(id) {
  const a = db.alunos.find((x) => x.id === id)
  if (!a) return ir('#/alunos')
  document.title = a.nome + ' · Discipulus'
  const u = db.usuarios.find((x) => x.idAluno === id)
  const m = matriculaDo(id)
  const bloqueado = u && u.bloqueadoAte && u.bloqueadoAte > Date.now()
  const acesso = !u ? ['Sem acesso', 'neutral'] : !u.ativo ? ['Inativo', 'danger'] : bloqueado ? ['Bloqueado até ' + formatHora(u.bloqueadoAte), 'danger'] : ['Ativo', 'success']

  casca('alunos', `
    <a class="voltar" href="#/alunos">‹ Alunos</a>
    ${cabecalho(esc(a.nome), `<span class="tab">RA ${esc(a.ra)}</span>`)}
    <div class="lado" style="margin-top:0">
      <div class="card rise" style="animation-delay:60ms">
        <div class="card-h"><h2>Boletim</h2><p>${m ? esc(cursoPorId(m.idCurso).nome) : 'Sem matrícula'}</p></div>
        ${tabelaBoletim(boletimDo(id))}
      </div>
      <div style="display:flex;flex-direction:column;gap:24px;min-width:0">
        <div class="card rise" style="animation-delay:100ms">
          <div class="card-h"><h2>Dados</h2></div>
          <dl class="dados">
            <div><dt>CPF</dt><dd class="tab">${esc(formatCpf(a.cpf))}</dd></div>
            <div><dt>E-mail</dt><dd>${esc(a.email)}</dd></div>
            ${a.telefone ? `<div><dt>Telefone</dt><dd class="tab">${esc(formatTel(a.telefone))}</dd></div>` : ''}
            ${a.cidade ? `<div><dt>Cidade</dt><dd>${esc(a.cidade)}${a.uf ? ' – ' + esc(a.uf) : ''}</dd></div>` : ''}
            ${m ? `<div><dt>Matrícula</dt><dd>${badge(MATRICULA[m.status])} <span class="small muted tab">desde ${formatData(m.data)}</span></dd></div>` : ''}
          </dl>
        </div>
        <div class="card rise" style="animation-delay:140ms">
          <div class="card-h"><h2>Acesso ao sistema</h2></div>
          <dl class="dados">
            <div><dt>Login</dt><dd class="tab">${u ? esc(u.login) : '—'}</dd></div>
            <div><dt>Situação</dt><dd>${badge(acesso)}</dd></div>
            <div><dt>Último acesso</dt><dd class="tab">${u && u.ultimoAcesso ? formatDataHora(u.ultimoAcesso) : 'Nunca entrou nesta demonstração'}</dd></div>
          </dl>
          ${u && pode('cadastros') ? `<div class="acoes" style="padding:0 24px 20px">
            ${bloqueado ? '<button class="btn btn-secondary btn-sm" id="desbloquear">Desbloquear</button>' : ''}
            <button class="btn btn-secondary btn-sm" id="ativar">${u.ativo ? 'Desativar acesso' : 'Reativar acesso'}</button>
          </div>` : ''}
        </div>
      </div>
    </div>`)

  document.getElementById('desbloquear')?.addEventListener('click', () => {
    u.bloqueadoAte = null; u.falhas = 0; salvar(); toast('Acesso desbloqueado.'); rota()
  })
  document.getElementById('ativar')?.addEventListener('click', () => {
    u.ativo = !u.ativo; salvar(); toast(u.ativo ? 'Acesso reativado.' : 'Acesso desativado.'); rota()
  })
}

function telaNovoAluno() {
  document.title = 'Novo aluno · Discipulus'
  const ativos = db.cursos.filter((c) => c.status === 'ATIVO')
  casca('alunos', `
    <a class="voltar" href="#/alunos">‹ Alunos</a>
    ${cabecalho('Novo aluno', 'O RA é gerado automaticamente. O aluno entra com o RA e a senha inicial.')}
    <form class="card rise" id="f-aluno" novalidate style="max-width:720px">
      <div class="form-grid">
        <div class="field full"><label for="nome">Nome completo</label><input class="input" id="nome" required></div>
        <div class="field"><label for="cpf">CPF (só números)</label><input class="input tab" id="cpf" inputmode="numeric" maxlength="11"></div>
        <div class="field"><label for="email">E-mail</label><input class="input" id="email" type="email"></div>
        <div class="field"><label for="tel">Telefone (opcional)</label><input class="input tab" id="tel" inputmode="numeric" maxlength="11"></div>
        <div class="field"><label for="cidade">Cidade (opcional)</label><input class="input" id="cidade"></div>
        <div class="field"><label for="curso">Curso</label><select class="input" id="curso">${ativos.map((c) => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
        <div class="field"><label for="senhaIni">Senha inicial</label><input class="input" id="senhaIni" value="${SENHA_PADRAO}"></div>
        <p class="err full" id="e-aluno" hidden></p>
        <div class="acoes full"><button class="btn btn-primary" type="submit">Cadastrar aluno</button><a class="btn btn-ghost" href="#/alunos" style="text-decoration:none">Cancelar</a></div>
      </div>
    </form>`)

  document.getElementById('f-aluno').addEventListener('submit', (e) => {
    e.preventDefault()
    const v = (id) => document.getElementById(id).value.trim()
    const erro = (msg) => { const p = document.getElementById('e-aluno'); p.hidden = false; p.textContent = msg }
    const cpf = v('cpf').replace(/\D/g, ''), email = v('email').toLowerCase(), tel = v('tel').replace(/\D/g, '')
    if (v('nome').split(/\s+/).length < 2) return erro('Informe o nome completo.')
    if (cpf.length !== 11) return erro('O CPF precisa ter 11 dígitos.')
    if (db.alunos.some((a) => a.cpf === cpf)) return erro('Já existe um aluno com esse CPF.')
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return erro('E-mail inválido.')
    if (db.alunos.some((a) => a.email === email)) return erro('Já existe um aluno com esse e-mail.')
    if (tel && tel.length < 10) return erro('Telefone inválido.')
    if (v('senhaIni').length < 8) return erro('A senha inicial precisa ter pelo menos 8 caracteres.')

    const id = Math.max(...db.alunos.map((a) => a.id)) + 1
    const ra = String(Math.max(...db.alunos.map((a) => Number(a.ra))) + 1)
    const hoje = new Date().toISOString().slice(0, 10)
    const idCurso = Number(v('curso'))
    db.alunos.push({ id, ra, nome: v('nome'), cpf, email, telefone: tel || null, cidade: v('cidade') || null, uf: v('cidade') ? 'SC' : null })
    db.matriculas.push({ idAluno: id, idCurso, data: hoje, status: 'ATIVA' })
    db.historico.push({ idAluno: id, idCurso, data: hoje, obs: 'Matrícula realizada' })
    db.usuarios.push({ login: ra, senha: v('senhaIni'), perfil: 'ALUNO', idAluno: id, ativo: true, falhas: 0, bloqueadoAte: null, ultimoAcesso: null })
    salvar()
    toast(`Aluno cadastrado. RA ${ra}`)
    ir('#/alunos/' + id)
  })
}

/* =====================================================================
   Funcionário: lançamento de notas
   ===================================================================== */
function lerNota(texto) {
  const t = texto.trim().replace(',', '.')
  if (t === '') return { ok: true, valor: null }
  if (!/^\d{1,2}(\.\d{1,2})?$/.test(t)) return { ok: false }
  const n = Number(t)
  return n >= 0 && n <= 10 ? { ok: true, valor: n } : { ok: false }
}

function telaNotas(idDisc) {
  document.title = 'Notas · Discipulus'
  const disc = db.disciplinas.find((d) => d.id === idDisc) || db.disciplinas[1]
  const curso = cursoPorId(disc.idCurso)
  const alunos = db.matriculas.filter((m) => m.idCurso === disc.idCurso).map((m) => ({ m, a: db.alunos.find((x) => x.id === m.idAluno) }))

  casca('notas', `
    ${cabecalho('Lançar notas', 'Escolha a disciplina, digite as notas (0 a 10) e salve. Deixe em branco o que ainda não foi aplicado.')}
    <div class="card rise" style="animation-delay:60ms">
      <div class="busca">
        <label class="sr" for="disc">Disciplina</label>
        <select class="input" id="disc" style="background:var(--surface-2);border:0">
          ${db.cursos.map((c) => `<optgroup label="${esc(c.nome)}">${db.disciplinas.filter((d) => d.idCurso === c.id).map((d) => `<option value="${d.id}"${d.id === disc.id ? ' selected' : ''}>${esc(d.nome)} (${d.semestre}º sem)</option>`).join('')}</optgroup>`).join('')}
        </select>
      </div>
      <form id="f-notas" novalidate>
        ${alunos.length ? `<div class="scroll" style="margin-top:0"><table class="tabela">
          <thead><tr><th>Aluno</th><th class="r">A1</th><th class="r">A2</th><th class="r">A3</th><th class="r">Média</th><th>Situação</th></tr></thead>
          <tbody>${alunos.map(({ m, a }) => {
            const n = db.notas[a.id + '-' + disc.id] || { A1: null, A2: null, A3: null }
            const travado = m.status !== 'ATIVA'
            return `<tr data-aluno="${a.id}">
              <td><p style="font-weight:500">${esc(a.nome)}</p><p class="small muted tab">RA ${esc(a.ra)}${travado ? ' · matrícula ' + MATRICULA[m.status][0].toLowerCase() : ''}</p></td>
              ${['A1', 'A2', 'A3'].map((av) => `<td class="r"><input class="input nota-in" data-av="${av}" aria-label="${av} de ${esc(a.nome)}" value="${n[av] === null || n[av] === undefined ? '' : nota(n[av])}"${travado ? ' disabled' : ''} inputmode="decimal"></td>`).join('')}
              <td class="r" data-media></td><td data-sit></td></tr>`
          }).join('')}</tbody></table></div>
          <div class="acoes" style="padding:16px 24px;border-top:1px solid var(--border);align-items:center">
            <button class="btn btn-primary" type="submit">Salvar notas</button>
            <span class="err" id="e-notas" hidden></span>
          </div>` : `<p class="vazio">Nenhum aluno matriculado em ${esc(curso.nome)}.</p>`}
      </form>
    </div>`)

  document.getElementById('disc').addEventListener('change', (e) => ir('#/notas/' + e.target.value))

  const linhas = [...app.querySelectorAll('tr[data-aluno]')]
  const ler = (tr) => {
    const r = {}
    let valido = true
    tr.querySelectorAll('input[data-av]').forEach((inp) => {
      const x = lerNota(inp.value)
      inp.setAttribute('aria-invalid', x.ok ? 'false' : 'true')
      if (!x.ok) valido = false
      r[inp.dataset.av] = x.ok ? x.valor : null
    })
    return { notas: r, valido }
  }
  const atualizar = (tr) => {
    const { notas: n, valido } = ler(tr)
    const s = situacao(n)
    tr.querySelector('[data-media]').innerHTML = valido ? notaHtml(s.media, true) : '<span class="err">inválida</span>'
    tr.querySelector('[data-sit]').innerHTML = valido && s.situacao ? badge(SITUACAO[s.situacao]) : ''
  }
  linhas.forEach((tr) => { atualizar(tr); tr.addEventListener('input', () => atualizar(tr)) })

  document.getElementById('f-notas').addEventListener('submit', (e) => {
    e.preventDefault()
    const erro = document.getElementById('e-notas')
    const lidas = linhas.map((tr) => ({ id: tr.dataset.aluno, ...ler(tr), travado: !!tr.querySelector('input:disabled') }))
    if (lidas.some((l) => !l.valido)) { erro.hidden = false; erro.textContent = 'Corrija as notas marcadas: use números de 0 a 10, como 7,5.'; return }
    erro.hidden = true
    lidas.filter((l) => !l.travado).forEach((l) => { db.notas[l.id + '-' + disc.id] = l.notas })
    salvar()
    toast(`Notas de ${disc.nome} salvas.`)
  })
}
